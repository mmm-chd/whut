<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="2808" viewBox="0 0 1920 2808">
  <defs>
    <!-- One unified sky: night space above, warm orange Mars sky below. -->
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060A1A"/>
      <stop offset="18%" stop-color="#101633"/>
      <stop offset="36%" stop-color="#2A2350"/>
      <stop offset="54%" stop-color="#5C3B4F"/>
      <stop offset="68%" stop-color="#B4653F"/>
      <stop offset="78%" stop-color="#D0814A"/>
      <stop offset="88%" stop-color="#E69B53"/>
      <stop offset="100%" stop-color="#F2A95A"/>
    </linearGradient>
    <radialGradient id="nebula" cx="72%" cy="12%" r="40%">
      <stop offset="0%" stop-color="#7C5C9A" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#3A2A5A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6E2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF6E2" stop-opacity="0"/>
    </radialGradient>
    <!-- Paper grain over the whole field (docs/art-direction.md #3). -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
    <!-- Dry-crayon streaks, stretched horizontally so they follow the sky band. -->
    <filter id="crayon" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.22" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1920" height="2808" fill="url(#space)"/>
  <rect width="1920" height="2808" fill="url(#nebula)"/>
