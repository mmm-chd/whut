<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Paper-cut crescent moon: a cream disc with a bitten edge and a warm rim.
       The bite is a mask, not a second arc path: two large arcs with the same
       winding cancel out and the previous version rendered as an empty shape. -->
  <defs>
    <mask id="crescent" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <circle cx="60" cy="60" r="54" fill="#ffffff" />
      <circle cx="80" cy="54" r="44" fill="#000000" />
    </mask>
  </defs>
  <g mask="url(#crescent)">
    <circle cx="60" cy="60" r="54" fill="#FFF1D6" />
    <circle cx="50" cy="72" r="42" fill="#F2DCBA" opacity="0.8" />
    <path d="M10 60 A50 50 0 0 1 60 10 L60 16 A44 44 0 0 0 16 60 Z" fill="#FFF9EA" opacity="0.9" />
  </g>
</svg>
