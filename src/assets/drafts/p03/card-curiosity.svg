  <title>Curiosity</title>
  <desc>A large six-wheeled rover: a box body, big aluminium wheels with zigzag treads, a power unit at the rear, a tall camera mast, a hexagonal dish on the deck, and a long front arm ending in a five-tool turret.</desc>
